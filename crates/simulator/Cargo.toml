[package]
name = "xau-sim"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
xau-core = { workspace = true }
xau-data = { workspace = true }
rand = "0.8"
serde = { workspace = true, features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"

[[bin]]
name = "xau-backtest"
path = "src/bin/backtest.rs"

[[bin]]
name = "xau-analyze"
path = "src/bin/analyze.rs"

[[bin]]
name = "xau-walkforward"
path = "src/bin/walkforward.rs"

[[bin]]
name = "xau-validate"
path = "src/bin/validate.rs"

[[bin]]
name = "xau-report"
path = "src/bin/report.rs"

[[bin]]
name = "xau-breakdown"
path = "src/bin/breakdown.rs"

[[bin]]
name = "xau-probe"
path = "src/bin/probe.rs"

[[bin]]
name = "xau-resample"
path = "src/bin/resample.rs"

[[bin]]
name = "xau-tpsweep"
path = "src/bin/tpsweep.rs"