# Phase 0 feasibility-spike configuration.
# Proves: MT5 EA (Wine) -> TCP -> Rust server -> test order -> fill -> close.
# §3: Record contract specs in config: point size, contract size (100 oz),
# min/max/step lot, and the lot size to use for trading.

[server]
host = "127.0.0.1"
port = 5555

[test_order]
enabled = true
lots = 0.01            # lot size for test orders (change to 0.10/1.00 for larger PnL)
sl_distance_pts = 100  # stop distance in points (scales with lot size)
tp_rr = 2.0            # take-profit as R multiple
max_slippage_pts = 30
magic = 424242
expect_demo = true
close_after_fill = true # exercise modify (tighten SL) then close

[lot_size_sensitivity]
# Sensitivity analysis levels: test multiple lot sizes via simulator
# Each level: lots, expected SL/TP in dollars per full round trip
levels = [
    { lots = 0.01, sl_pts = 100, tp_pts = 200 },   # $1.00 / $2.00 per trade
    { lots = 0.10, sl_pts = 100, tp_pts = 200 },   # $10.00 / $20.00 per trade
    { lots = 1.00, sl_pts = 100, tp_pts = 200 },   # $100.00 / $200.00 per trade
    { lots = 10.00, sl_pts = 100, tp_pts = 200 },  # $1000.00 / $2000.00 per trade
]

[strategy]
# Chosen strategy configuration, used by `xau-backtest`, `xau-report`,
# `xau-walkforward` and `xau-validate`.
#
# ✅ Validated on 16.9 years of H1 (2010-01 -> 2026-11). See
#    docs/strategy-long-history.md for the full evidence.
#
#    +$26,647 at 0.10 lot on $25,000 (+106.6%), profit factor 1.32,
#    max drawdown 9.9%, 14 of 17 years profitable, both long and short
#    sides positive, profitable at 3x spread, and profitable on an
#    independent M15 dataset, with every cell of the parameter grid
#    positive.
#
# ⚠️  Still paper_only. 65% of the profit came from 2025-26, the strategy
# has not been forward-tested on unseen data, and the broker only has
# 17 years of H1 (nothing deeper below that). Validate on demo before
# risking real money.
name = "donchian"          # ma-cross | donchian | bollinger | pullback | rsi
lookback = 55              # breakout window (55-bar high/low)
trend_ma = 300             # EMA(300) trend gate
lots = 0.10
atr_period = 14
sl_atr = 1.5               # stop = 1.5 x ATR
tp_atr = 0.0               # no fixed target
trail_atr = 2.5            # trailing stop at 2.5 x ATR from the best price
max_hold_bars = 240        # time exit after 240 bars
allowed_hours_utc = []     # trade all hours
spread_pts = 20
paper_only = true

[timeouts]
hello_s = 10
first_tick_s = 30
fill_s = 30
overall_s = 180
stale_ms = 5000        # README: halt on >5s silence

[transcript]
path = "runs/phase0/transcript.jsonl"
