# XAUUSD contract specs for data imported in TRUE UTC.
# Identical to xauusd.toml except server_utc_offset_s = 0, because
# scripts/fetch_mcp_history.py already converts server-local (EET/EEST)
# timestamps to UTC before writing the CSV.
# Use this spec with: xau data import --config configs/symbols/xauusd_utc.toml

[symbol]
name = "XAUUSD"
digits = 2
point = 0.01
contract_size = 100.0
tick_size = 0.01
tick_value = 0.1
volume_min = 0.01
volume_max = 100.0
volume_step = 0.01
stops_level_pts = 0
freeze_level_pts = 0
swap_mode = 1
swap_long_pts = -12.6
swap_short_pts = -4.6
swap_rollover3day_dow = 3
margin_initial = 0.0
margin_maintenance = 0.0
server_utc_offset_s = 0
