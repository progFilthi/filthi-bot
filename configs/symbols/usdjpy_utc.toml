# USDJPY contract specs for data imported in TRUE UTC.
#
# Caveat: on this pair the P&L is quoted in JPY, so a dollar figure needs
# dividing by the USDJPY rate. The simulator has no per-symbol conversion, so
# tests use an approximate fixed divisor (contract ≈ 100000/159 ≈ 629) and the
# percentage metrics are the ones to read. Profit factor, win rate and trade
# count are unaffected by a constant scale factor.
# Use with: xau data import --config configs/symbols/usdjpy_utc.toml

[symbol]
name = "USDJPY"
digits = 3
point = 0.001
contract_size = 100000.0
tick_size = 0.001
tick_value = 0.1
volume_min = 0.01
volume_max = 500.0
volume_step = 0.01
stops_level_pts = 0
freeze_level_pts = 0
swap_mode = 1
swap_long_pts = -18.0
swap_short_pts = -18.0
swap_rollover3day_dow = 3
margin_initial = 0.0
margin_maintenance = 0.0
server_utc_offset_s = 0
